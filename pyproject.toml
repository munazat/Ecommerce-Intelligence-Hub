[project]
name = "ecommerce-intelligence-hub"
version = "0.1.0"
description = "End-to-end customer analytics platform: CLV, churn, segmentation, forecasting, and retention decisioning on e-commerce transaction data."
authors = [
    { name = "Munaza Tariq", email = "munaxa.tm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
]

[tool.uv.build-backend]
module-name = "hub"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
