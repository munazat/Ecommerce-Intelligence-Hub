[project]
name = "ecommerce-intelligence-hub"
version = "0.1.0"
description = "End-to-end customer analytics platform: CLV, churn, segmentation, forecasting, and retention decisioning on e-commerce transaction data."
authors = [
    { name = "Munaza Tariq", email = "munaxa.tm@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[tool.uv.build-backend]
module-name = "hub"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
